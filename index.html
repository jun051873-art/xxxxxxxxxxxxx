<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>剪髮快手 V0.9 剪刀物理核心</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#281b16;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;touch-action:none}button{font:inherit}#app{position:fixed;inset:0;background:linear-gradient(#2c1d17 0 7%,#ead8c6 7%);overflow:hidden}.top{position:absolute;z-index:30;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between}.pill{border:0;border-radius:999px;padding:9px 13px;background:#45362e;color:#fff;font-weight:900;font-size:13px}.stage{position:absolute;top:64px;bottom:108px;left:10px;right:10px;border:7px solid #7a5843;border-radius:30px;background:radial-gradient(circle at 50% 12%,#fffaf3,#e8d1ba 64%,#cfad90);overflow:hidden;touch-action:none}.note{position:absolute;z-index:15;top:13px;left:7%;right:7%;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 6px 18px #0002;text-align:center;font-weight:900}.note small{display:block;margin-top:3px;color:#79675a;font-size:11px}.person{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:320px;height:520px}.head{position:absolute;z-index:3;left:50%;top:115px;transform:translateX(-50%);width:178px;height:205px;border:2px solid #bf8e70;border-radius:48% 48% 52% 52%;background:#efc09e}.eye,.brow,.mouth{position:absolute;transition:.14s}.brow{top:64px;width:39px;height:5px;border-radius:999px;background:#493129}.brow.l{left:28px}.brow.r{right:28px}.eye{top:82px;width:18px;height:9px;border-radius:50%;background:#38251f}.eye.l{left:44px}.eye.r{right:44px}.mouth{left:50%;top:136px;transform:translateX(-50%);width:45px;height:18px;border-bottom:5px solid #a45f56;border-radius:50%}.head.blink .eye{height:2px;top:86px}.head.focus .brow.l{transform:rotate(12deg)}.head.focus .brow.r{transform:rotate(-12deg)}.head.focus .mouth{width:29px;border-bottom-width:3px}.head.worry .brow.l{transform:rotate(20deg)}.head.worry .brow.r{transform:rotate(-20deg)}.head.worry .mouth{width:24px;height:15px;border-bottom:0;border-top:4px solid #a45f56}.head.happy .eye{height:3px;top:86px}.head.happy .mouth{width:54px;height:24px;border-bottom-width:6px}.cape{position:absolute;z-index:2;top:300px;left:50%;transform:translateX(-50%);width:296px;height:220px;padding-top:82px;border-radius:48% 48% 12% 12%;background:linear-gradient(#faf7f1,#ddd8d0);color:#9b7357;text-align:center;font-size:28px;font-weight:900}.cape small{display:block;font-size:9px}canvas{position:absolute;z-index:6;left:50%;top:40px;transform:translateX(-50%);width:292px;height:292px;touch-action:none}#fx{z-index:7;pointer-events:none}.scissor{position:absolute;z-index:20;display:none;pointer-events:none;font-size:54px;transform:translate(-50%,-50%) rotate(-15deg);filter:drop-shadow(0 4px 5px #0005)}.scissor.snip{animation:snip .15s steps(2,end) infinite}@keyframes snip{0%{transform:translate(-50%,-50%) rotate(-28deg) scale(.92)}100%{transform:translate(-50%,-50%) rotate(7deg) scale(1.06)}}.bottom{position:absolute;z-index:40;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px;height:88px}.mode,.reset{border:0;border-radius:20px;font-weight:900}.mode{background:#fffaf5}.mode strong{display:block;font-size:25px}.mode.on{outline:3px solid #ad744a;background:#f5dec5}.reset{background:#45362e;color:#fff}.toast{position:absolute;z-index:80;left:50%;top:51%;opacity:0;transform:translate(-50%,-50%) scale(.86);padding:9px 16px;border-radius:999px;background:#44352d;color:#fff;font-weight:900;transition:.14s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.legend{position:absolute;z-index:18;left:15px;right:15px;bottom:12px;text-align:center;color:#6f5d51;font-size:11px}.legend b{color:#3f312a}.done{position:absolute;z-index:90;inset:24% 8%;display:none;align-items:center;justify-content:center;border-radius:28px;background:#fffaf5;text-align:center;padding:22px;box-shadow:0 20px 50px #0004}.done.show{display:flex}.done button{border:0;border-radius:16px;background:#45362e;color:#fff;padding:12px 18px;font-weight:900}</style></head><body><div id="app">
<div class="top"><div class="pill">剪刀物理核心</div><div class="pill">✂️ <span id="cuts">0</span></div></div>
<main class="stage" id="stage"><div class="note">只測「剪」<small id="hint">橫著滑＝平剪；直著滑＝點剪碎化；斜著滑＝斜線輪廓。</small></div><div class="person"><div class="head" id="head"><i class="brow l"></i><i class="brow r"></i><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div><canvas id="hair" width="640" height="640"></canvas><canvas id="fx" width="640" height="640"></canvas><div class="cape">ES<small>HAIR SALON</small></div></div><div class="scissor" id="scissor">✂️</div><div class="toast" id="toast">喀嚓</div><div class="legend"><b>技巧：</b>慢慢拖會比較細；快速一刀會比較俐落。</div></main>
<div class="bottom"><button class="mode on" id="scissors"><strong>✂️</strong>自由剪</button><button class="reset" id="reset">↻ 重來</button></div>
<section class="done" id="done"><div><div style="font-size:42px">✨✂️✨</div><h2>剪刀手感測試完成</h2><p>這版只看「剪」本身的感覺。</p><button id="again">再剪一次</button></div></section>
</div><script>
(()=>{
const $=s=>document.querySelector(s),stage=$('#stage'),C=$('#hair'),X=C.getContext('2d'),F=$('#fx'),FX=F.getContext('2d'),head=$('#head'),sc=$('#scissor');
let strands=[],pieces=[],drag=false,last=null,cuts=0,blinkTimer=0;
const W=640,H=640;
function rand(a,b){return a+Math.random()*(b-a)}
function makeHair(){
 strands=[];
 for(let i=0;i<185;i++){
   const t=i/184,ang=Math.PI*(.93+1.14*t),rx=225,ry=185;
   const rootX=320+Math.cos(ang)*92,rootY=225+Math.sin(ang)*68;
   let len=rand(125,225)*(1-.15*Math.abs(t-.5));
   const spread=(t-.5)*160;
   const tipX=320+spread+rand(-24,24),tipY=150+len+Math.abs(t-.5)*72+rand(-18,18);
   const ctrlX=(rootX+tipX)/2+rand(-24,24),ctrlY=(rootY+tipY)/2-rand(12,38);
   strands.push({rootX,rootY,tipX,tipY,ctrlX,ctrlY,cut:false,width:rand(3.1,5.4),shade:Math.random()});
 }
}
function drawHair(){
 X.clearRect(0,0,W,H);X.lineCap='round';
 for(const s of strands){
   const grd=X.createLinearGradient(s.rootX,s.rootY,s.tipX,s.tipY);
   grd.addColorStop(0,s.shade>.5?'#604034':'#513228');grd.addColorStop(1,'#20120f');
   X.strokeStyle=grd;X.lineWidth=s.width;X.beginPath();X.moveTo(s.rootX,s.rootY);X.quadraticCurveTo(s.ctrlX,s.ctrlY,s.tipX,s.tipY);X.stroke();
 }
}
function reset(){makeHair();pieces=[];cuts=0;$('#cuts').textContent='0';$('#done').classList.remove('show');$('#hint').textContent='橫著滑＝平剪；直著滑＝點剪碎化；斜著滑＝斜線輪廓。';face('normal');drawHair()}
function face(m){head.className='head'+(m==='normal'?'':' '+m)}
function point(e){const r=C.getBoundingClientRect(),sr=stage.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,sx:e.clientX-sr.left,sy:e.clientY-sr.top}}
function distPointSegment(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,c1=vx*wx+vy*wy;if(c1<=0)return Math.hypot(px-ax,py-ay);const c2=vx*vx+vy*vy;if(c2<=c1)return Math.hypot(px-bx,py-by);const u=c1/c2;return Math.hypot(px-(ax+u*vx),py-(ay+u*vy))}
function snip(a,b){
 const dx=b.x-a.x,dy=b.y-a.y,vertical=Math.abs(dy)>Math.abs(dx)*1.2,horizontal=Math.abs(dx)>Math.abs(dy)*1.2;
 let did=0;
 for(const s of strands){
   const d=distPointSegment(s.tipX,s.tipY,a.x,a.y,b.x,b.y);
   const shaftD=distPointSegment((s.ctrlX+s.tipX)/2,(s.ctrlY+s.tipY)/2,a.x,a.y,b.x,b.y);
   if(Math.min(d,shaftD)<(vertical?30:24)){
     const oldX=s.tipX,oldY=s.tipY;
     if(vertical){
       const shorten=rand(10,32);
       const vx=s.tipX-s.rootX,vy=s.tipY-s.rootY,L=Math.max(1,Math.hypot(vx,vy)),nl=Math.max(55,L-shorten);
       s.tipX=s.rootX+vx/L*nl+rand(-6,6);s.tipY=s.rootY+vy/L*nl+rand(-3,8);
     }else{
       const vx=b.x-a.x,vy=b.y-a.y,den=vx*vx+vy*vy||1,u=((s.tipX-a.x)*vx+(s.tipY-a.y)*vy)/den;
       const cx=a.x+u*vx,cy=a.y+u*vy;
       s.tipX=s.tipX*.25+cx*.75;s.tipY=s.tipY*.25+cy*.75+(horizontal?rand(-2,2):rand(-5,5));
     }
     s.ctrlX=(s.rootX+s.tipX)/2+rand(-18,18);s.ctrlY=(s.rootY+s.tipY)/2-rand(8,26);
     pieces.push({x:oldX,y:oldY,vx:rand(-1.8,1.8),vy:rand(.8,2.2),rot:rand(0,6.28),vr:rand(-.18,.18),len:rand(10,28),a:1});
     did++;
   }
 }
 if(did){cuts+=did;$('#cuts').textContent=cuts;drawHair();flash(vertical?'點剪 ✂︎':horizontal?'平剪 ✂️':'斜剪 ✂️');face('focus');if(cuts>38){face('happy');$('#hint').textContent='已經剪出明顯輪廓了。你可以繼續修細節。'}}
}
function flash(t){const z=$('#toast');z.textContent=t;z.classList.add('show');setTimeout(()=>z.classList.remove('show'),260)}
function down(e){const p=point(e);drag=true;last=p;sc.style.display='block';sc.style.left=p.sx+'px';sc.style.top=p.sy+'px';sc.classList.add('snip');face('focus');try{stage.setPointerCapture(e.pointerId)}catch{}e.preventDefault()}
function move(e){if(!drag)return;const p=point(e);sc.style.left=p.sx+'px';sc.style.top=p.sy+'px';const ang=Math.atan2(p.y-last.y,p.x-last.x)*180/Math.PI;sc.style.transform='translate(-50%,-50%) rotate('+(ang-15)+'deg)';if(Math.hypot(p.x-last.x,p.y-last.y)>8){snip(last,p);last=p}e.preventDefault()}
function up(){if(!drag)return;drag=false;sc.style.display='none';sc.classList.remove('snip');face('normal')}
stage.addEventListener('pointerdown',down,{passive:false});stage.addEventListener('pointermove',move,{passive:false});stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
$('#reset').onclick=reset;$('#again').onclick=reset;
setInterval(()=>{if(!drag){head.classList.add('blink');setTimeout(()=>head.classList.remove('blink'),120)}},3200);
function anim(){FX.clearRect(0,0,W,H);pieces=pieces.filter(p=>p.a>.02&&p.y<H+30);for(const p of pieces){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.rot+=p.vr;p.a*=.968;FX.save();FX.globalAlpha=p.a;FX.translate(p.x,p.y);FX.rotate(p.rot);FX.strokeStyle='#2b1914';FX.lineWidth=3;FX.beginPath();FX.moveTo(-p.len/2,0);FX.quadraticCurveTo(0,4,p.len/2,0);FX.stroke();FX.restore()}requestAnimationFrame(anim)}anim();reset();
})();
</script></body></html>
