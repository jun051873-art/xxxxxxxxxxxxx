<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>剪髮快手 V0.6 真實選髮型</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#281b16;font-family:-apple-system,"PingFang TC",sans-serif;touch-action:none}#app{position:fixed;inset:0;background:linear-gradient(#2b1d17 0 7%,#ead7c3 7%)}button{font:inherit}.top{position:absolute;z-index:20;top:14px;left:12px;right:12px;display:flex;justify-content:space-between}.pill{border:0;border-radius:99px;padding:9px 13px;background:#45362e;color:#fff;font-weight:800}.stage{position:absolute;top:65px;bottom:118px;left:12px;right:12px;border:7px solid #795741;border-radius:28px;background:radial-gradient(circle at 50% 15%,#fff8ef,#e5cdb5);overflow:hidden;touch-action:none}.bubble{position:absolute;z-index:10;top:14px;left:7%;right:7%;background:#fff;border-radius:18px;padding:10px;text-align:center;font-weight:800}.person{position:absolute;left:50%;top:105px;transform:translateX(-50%);width:300px;height:500px}.head{position:absolute;z-index:3;left:50%;top:100px;transform:translateX(-50%);width:170px;height:200px;border-radius:48%;background:#efc09e;border:2px solid #c08d6d}.eye{position:absolute;top:80px;width:18px;height:9px;background:#38251f;border-radius:50%}.eye.l{left:42px}.eye.r{right:42px}.blink .eye{height:2px}.mouth{position:absolute;left:61px;top:130px;width:45px;height:20px;border-bottom:5px solid #a45f56;border-radius:50%}.cape{position:absolute;z-index:2;top:280px;left:50%;transform:translateX(-50%);width:285px;height:220px;border-radius:48% 48% 12% 12%;background:linear-gradient(#faf7f1,#ddd8d0);text-align:center;padding-top:80px;color:#9b7357;font-size:28px;font-weight:900}canvas{position:absolute;z-index:5;left:50%;top:40px;transform:translateX(-50%);width:270px;height:270px;touch-action:none}#fx{z-index:6;pointer-events:none}.cursor{position:absolute;z-index:12;display:none;font-size:46px;pointer-events:none;transform:translate(-50%,-50%)}.tools{position:absolute;z-index:30;bottom:8px;left:8px;right:8px;height:98px;background:#fffaf5;border-radius:22px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tool{border:2px solid transparent;border-radius:15px;background:#eee8e1;font-size:11px;font-weight:800}.tool b{display:block;font-size:25px}.tool.on{border-color:#ad744a;background:#f4dec5}.reset{background:#45362e;color:#fff}.picker{display:none;position:absolute;z-index:50;inset:64px 10px 116px;background:#fffaf5;border-radius:24px;padding:12px;overflow:auto;touch-action:pan-y}.picker.show{display:block}.ph{display:flex;justify-content:space-between;align-items:center}.ph h2{font-size:17px}.close{width:40px;height:40px;border:0;border-radius:50%;background:#45362e;color:#fff;font-size:20px}.filters{display:flex;gap:6px;overflow:auto;margin-bottom:9px}.filter{border:0;border-radius:99px;padding:8px 12px;white-space:nowrap}.filter.on{background:#45362e;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{min-height:82px;border:2px solid transparent;border-radius:14px;background:#eee8e1;font-size:10px;font-weight:800}.card.on{border-color:#ad744a}.card span{display:block;font-size:31px}.toast{position:absolute;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 15px;border-radius:99px;background:#45362e;color:#fff;font-weight:900;opacity:0}.toast.show{opacity:1}
</style></head><body><div id="app"><div class="top"><button id="choose" class="pill">💇 選髮型 · 01</button><div class="pill">⭐ <span id="score">0</span></div></div><div class="stage" id="stage"><div class="bubble" id="bubble">自由練習：先選髮型，再直接動手剪。</div><div class="person" id="person"><div class="head"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div><canvas id="hair" width="540" height="540"></canvas><canvas id="fx" width="540" height="540"></canvas><div class="cape">ES<div style="font-size:10px">HAIR SALON</div></div></div><div class="cursor" id="cursor">🪒</div><div class="toast" id="toast">喀嚓！</div></div><div class="tools"><button class="tool" data-t="scissors"><b>✂️</b>剪刀</button><button class="tool on" data-t="clipper"><b>🪒</b>電推</button><button class="tool" data-t="thin"><b>✂︎</b>打薄</button><button class="tool" data-t="dryer"><b>💨</b>吹風</button><button class="tool reset" id="reset"><b>↻</b>重來</button></div><section class="picker" id="picker"><div class="ph"><h2>髮型實驗室 · 30 款</h2><button class="close" id="close">×</button></div><div class="filters"><button class="filter on" data-f="all">全部</button><button class="filter" data-f="male">男生</button><button class="filter" data-f="female">女生</button><button class="filter" data-f="short">短髮</button><button class="filter" data-f="medium">中髮</button><button class="filter" data-f="long">長髮</button></div><div class="grid" id="grid"></div><button id="applyHair" style="position:sticky;bottom:4px;width:100%;margin-top:10px;border:0;border-radius:18px;padding:13px;background:#45362e;color:#fff;font-weight:900">套用目前髮型並開始修剪</button></section></div><script>
const $=s=>document.querySelector(s),C=$('#hair'),X=C.getContext('2d'),F=$('#fx'),FX=F.getContext('2d'),stage=$('#stage'),person=$('#person'),cursor=$('#cursor'),bubble=$('#bubble'),picker=$('#picker'),grid=$('#grid');let tool='clipper',cur=0,drag=false,last=null,score=0,parts=[],fil='all';
const names=['俐落短寸','自然短髮','厚瀏海','側分短髮','刺蝟短髮','蓬鬆短髮','韓系中短','自然中髮','微捲中髮','層次中髮','精靈短髮','短鮑伯','齊瀏海短髮','外翹短髮','短捲髮','中長直髮','中長層次','中長波浪','公主中髮','鎖骨髮','長直髮','長波浪','大捲長髮','公主長髮','長層次','銀髮短髮','銀髮中髮','自然亂髮','爆炸捲','長捲髮'];const S=names.map((n,i)=>[n,i<10||i==25||i==27||i==28?'male':'female',i<6||i>=10&&i<15||i==25?'short':i>=20&&i<25||i==29?'long':'medium']);
function path(i){let t=S[i][2];X.beginPath();if(t==='short'){X.moveTo(115,310);X.bezierCurveTo(80,125,150,50,270,55);X.bezierCurveTo(400,55,465,140,425,310);X.lineTo(380,260);X.bezierCurveTo(360,145,180,135,150,265);X.closePath()}else if(t==='medium'){X.moveTo(75,410);X.bezierCurveTo(55,150,140,45,270,55);X.bezierCurveTo(420,55,485,165,460,410);X.lineTo(390,375);X.bezierCurveTo(390,185,155,175,145,375);X.closePath()}else{X.moveTo(45,530);X.bezierCurveTo(35,170,130,40,270,55);X.bezierCurveTo(435,55,505,185,490,530);X.lineTo(400,490);X.bezierCurveTo(405,210,140,210,135,490);X.closePath()}}
function detailShape(i){
  X.save();
  let n=i%10;
  if(n===2){ /* thick fringe */
    X.beginPath(); X.moveTo(145,155); X.quadraticCurveTo(205,205,270,160); X.quadraticCurveTo(335,205,395,150);
    X.lineTo(385,235); X.quadraticCurveTo(270,205,155,240); X.closePath(); X.fill();
  } else if(n===3){ /* side part */
    X.beginPath(); X.moveTo(155,160); X.quadraticCurveTo(245,75,405,155); X.quadraticCurveTo(315,135,220,230); X.closePath(); X.fill();
  } else if(n===4){ /* spikes */
    for(let x=145;x<400;x+=38){X.beginPath();X.moveTo(x,150);X.lineTo(x+18,65-(x%3)*9);X.lineTo(x+38,155);X.closePath();X.fill();}
  } else if(n===5){ /* fluffy */
    for(let x=145;x<405;x+=42){X.beginPath();X.arc(x,130+(x%4)*8,42,0,Math.PI*2);X.fill();}
  } else if(n===8 || n===9){ /* curls */
    X.lineWidth=18; X.strokeStyle=X.fillStyle;
    for(let x=115;x<430;x+=45){X.beginPath();for(let y=135;y<390;y+=12){let xx=x+Math.sin(y/16+x)*16;y===135?X.moveTo(xx,y):X.lineTo(xx,y)}X.stroke();}
  }
  if(i===28){ /* afro */
    for(let a=0;a<Math.PI*2;a+=.42){let x=270+Math.cos(a)*150,y=190+Math.sin(a)*120;X.beginPath();X.arc(x,y,58,0,7);X.fill();}
  }
  X.restore();
}
function draw(){X.clearRect(0,0,540,540);let g=X.createLinearGradient(80,50,450,500),silver=S[cur][0].includes('銀');g.addColorStop(0,silver?'#ddd4cd':'#624031');g.addColorStop(.55,silver?'#aaa099':'#2c1914');g.addColorStop(1,silver?'#80766f':'#160c0a');path(cur);X.fillStyle=g;X.fill();detailShape(cur);X.save();X.globalCompositeOperation='source-atop';X.strokeStyle='rgba(255,255,255,.1)';X.lineWidth=7;let wave=/捲|波浪|亂/.test(S[cur][0]);for(let x=90;x<470;x+=22){X.beginPath();for(let y=70;y<520;y+=12){let xx=x+(wave?Math.sin(y/17+x)*9:Math.sin(y/45+x)*3);y==70?X.moveTo(xx,y):X.lineTo(xx,y)}X.stroke()}X.restore()}
function reset(){draw();score=0;$('#score').textContent=0;bubble.textContent='自由練習：手指走哪裡，頭髮就在哪裡改變。'}
function miniSVG(i){
 let t=S[i][2], female=S[i][1]==='female', silver=S[i][0].includes('銀');
 let c=silver?'#aaa099':'#2d1a14', skin='#efc09e';
 let hair=t==='short'
  ? '<path d="M20 49 Q16 12 50 10 Q86 12 80 49 L70 39 Q50 24 30 40Z" fill="'+c+'"/>'
  : t==='medium'
  ? '<path d="M13 72 Q9 13 50 9 Q91 14 87 73 L73 66 Q74 29 50 27 Q26 29 27 66Z" fill="'+c+'"/>'
  : '<path d="M8 91 Q5 12 50 8 Q96 13 92 91 L76 84 Q78 29 50 25 Q22 29 24 84Z" fill="'+c+'"/>';
 let extra='';
 switch(i%10){
  case 2: extra='<path d="M25 28 Q50 48 76 26 L72 48 Q50 39 28 49Z" fill="'+c+'"/>';break;
  case 3: extra='<path d="M24 31 Q50 5 81 29 Q55 22 32 51Z" fill="'+c+'"/>';break;
  case 4: extra='<path d="M23 26 L31 5 L40 27 L50 3 L59 27 L69 6 L78 30Z" fill="'+c+'"/>';break;
  case 5: extra='<circle cx="30" cy="20" r="14" fill="'+c+'"/><circle cx="50" cy="14" r="16" fill="'+c+'"/><circle cx="70" cy="21" r="14" fill="'+c+'"/>';break;
 }
 if(i===28) extra='<circle cx="25" cy="25" r="23" fill="'+c+'"/><circle cx="50" cy="15" r="27" fill="'+c+'"/><circle cx="76" cy="25" r="23" fill="'+c+'"/>';
 return '<svg viewBox="0 0 100 105" style="width:58px;height:58px;display:block;margin:auto">'+hair+extra+'<ellipse cx="50" cy="52" rx="22" ry="27" fill="'+skin+'"/><circle cx="42" cy="50" r="2.5"/><circle cx="58" cy="50" r="2.5"/><path d="M43 63 Q50 68 57 63" fill="none" stroke="#a45f56" stroke-width="2"/></svg>';
}
function cards(){grid.innerHTML='';S.forEach((s,i)=>{if(fil!=='all'&&!s.includes(fil))return;let b=document.createElement('button');b.className='card'+(i===cur?' on':'');b.innerHTML=miniSVG(i)+'<div>'+String(i+1).padStart(2,'0')+' · '+s[0]+'</div>';b.onclick=()=>{cur=i;reset();$('#choose').textContent='💇 選髮型 · '+String(i+1).padStart(2,'0');cards()};grid.appendChild(b)})}
function p(e){let r=C.getBoundingClientRect(),sr=stage.getBoundingClientRect();return{x:(e.clientX-r.left)*540/r.width,y:(e.clientY-r.top)*540/r.height,sx:e.clientX-sr.left,sy:e.clientY-sr.top}}
function erase(q,r,a=1){X.save();X.globalCompositeOperation='destination-out';X.globalAlpha=a;let g=X.createRadialGradient(q.x,q.y,0,q.x,q.y,r);g.addColorStop(0,'#000');g.addColorStop(.75,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.beginPath();X.arc(q.x,q.y,r,0,7);X.fill();X.restore()}
function line(a,b){let d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/8));for(let i=0;i<=n;i++){let q={x:a.x+(b.x-a.x)*i/n,y:a.y+(b.y-a.y)*i/n};erase(q,tool==='clipper'?25:tool==='scissors'?16:30,tool==='thin'?.16:1);if(i%4===0)parts.push({x:q.x,y:q.y,v:(Math.random()*2+1),a:1})}}
function anim(){FX.clearRect(0,0,540,540);parts=parts.filter(o=>o.a>.03&&o.y<540);for(let o of parts){o.y+=o.v;o.v+=.13;o.a*=.96;FX.globalAlpha=o.a;FX.strokeStyle='#2b1914';FX.lineWidth=3;FX.beginPath();FX.moveTo(o.x,o.y);FX.lineTo(o.x+4,o.y+12);FX.stroke()}FX.globalAlpha=1;requestAnimationFrame(anim)}anim();
function down(e){if(tool==='dryer')return;let q=p(e);if(q.x<25||q.x>515||q.y<20||q.y>535)return;drag=true;last=q;cursor.style.display='block';cursor.style.left=q.sx+'px';cursor.style.top=q.sy+'px';if(tool==='thin'){erase(q,31,.16);parts.push({x:q.x,y:q.y,v:2,a:1});flash('喀嚓！')}try{stage.setPointerCapture(e.pointerId)}catch{}e.preventDefault()}
function move(e){if(!drag)return;let q=p(e);cursor.style.left=q.sx+'px';cursor.style.top=q.sy+'px';line(last,q);last=q;if(q.y<150){bubble.textContent='欸欸～上面不要太短喔！ 😳';person.classList.add('blink')}else person.classList.remove('blink');e.preventDefault()}
function up(){if(!drag)return;drag=false;cursor.style.display='none';person.classList.remove('blink');score+=10;$('#score').textContent=score}
function flash(t){let z=$('#toast');z.textContent=t;z.classList.add('show');setTimeout(()=>z.classList.remove('show'),300)}
stage.addEventListener('pointerdown',down,{passive:false});stage.addEventListener('pointermove',move,{passive:false});stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
document.querySelectorAll('.tool[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tool=b.dataset.t;cursor.textContent={scissors:'✂️',clipper:'🪒',thin:'✂︎',dryer:'💨'}[tool];bubble.textContent=tool==='thin'?'打薄剪可以點一下，也可以按住來回滑。':tool==='dryer'?'吹風功能下一階段加入方向造型。':'直接在頭髮上操作。'});
$('#applyHair').onclick=()=>{picker.classList.remove('show');bubble.textContent='已套用「'+S[cur][0]+'」。現在直接在頭髮上修剪。'};$('#reset').onclick=reset;$('#choose').onclick=()=>{cards();picker.classList.add('show')};$('#close').onclick=()=>picker.classList.remove('show');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');fil=b.dataset.f;cards()});setInterval(()=>{person.classList.add('blink');setTimeout(()=>person.classList.remove('blink'),130)},3200);draw();cards();
</script></body></html>
